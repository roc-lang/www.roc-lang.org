name: Check Internal Links

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
#  pull_request:

jobs:
  check-links:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check internal links
      run: |
        ./ci_scripts/check-links.sh 4
        # 4 is the recursion depth for checking links

    # Old URLs kept alive by website/public/_redirects. Nothing on the site
    # links to them, so the crawl above can never reach them; they need their
    # own check to notice when a redirect stops working.
    - name: Check redirects
      if: always() # report broken redirects even when the crawl above failed
      run: ./ci_scripts/check-redirects.sh
